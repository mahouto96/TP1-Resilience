
name: tp1-resilience

services:
  web1:
    image: nginx:stable-alpine
    volumes:
      - ./web1:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health.html"]
      interval: 5s
      timeout: 2s
      retries: 3

  web2:
    image: nginx:stable-alpine
    volumes:
      - ./web2:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health.html"]
      interval: 5s
      timeout: 2s
      retries: 3

  proxy:
    image: haproxy:3.2-alpine
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8404:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
